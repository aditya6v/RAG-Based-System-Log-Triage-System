<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Copilot</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1b1f24; --muted:#5b6672; --border:#e1e5ea;
    --accent:#2f6fed; --accent-text:#ffffff; --code-bg:#f0f2f5;
    --ok:#1a7f4b; --ok-bg:#e3f5ea; --warn:#a15c00; --warn-bg:#fdf0d9;
    --bad:#b3261e; --bad-bg:#fde7e5; --info:#5b3fc4; --info-bg:#ece8fb; --neutral:#4a5561; --neutral-bg:#eceff3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171b; --card:#1d2127; --text:#e8ebef; --muted:#9aa5b1; --border:#2d343c;
      --accent:#5b8cff; --accent-text:#0e1116; --code-bg:#252b33;
      --ok:#6fd49b; --ok-bg:#16301f; --warn:#f0b865; --warn-bg:#3a2c12;
      --bad:#ff8f87; --bad-bg:#3b1a18; --info:#b3a2ff; --info-bg:#27204a; --neutral:#b4bec9; --neutral-bg:#2a313a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.up{background:var(--ok)} .dot.down{background:var(--bad)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
  label{display:block;font-weight:600;margin-bottom:6px}
  textarea{width:100%;min-height:96px;resize:vertical;padding:10px;border:1px solid var(--border);border-radius:8px;
    background:var(--code-bg);color:var(--text);font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .samples{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
  .chip{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  button.primary{background:var(--accent);color:var(--accent-text);border:0;border-radius:8px;padding:9px 20px;font-size:15px;font-weight:600;cursor:pointer}
  button.primary:disabled{opacity:.6;cursor:wait}
  .hint{color:var(--muted);font-size:13px}
  .badge{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:600;font-size:14px}
  .badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)}
  .badge.neutral{background:var(--neutral-bg);color:var(--neutral)}
  .section-title{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
  .section-title:first-child{margin-top:0}
  p{margin:0}
  code,.mono{font:12.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code-bg);padding:2px 6px;border-radius:4px;word-break:break-all}
  .hit{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:8px}
  .bar{height:6px;border-radius:3px;background:var(--code-bg);margin:6px 0 8px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent)}
  .meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .error{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px}
  details{margin-top:14px;color:var(--muted);font-size:13px}
  ul{margin:6px 0 0;padding-left:20px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Incident Copilot</h1>
      <div class="sub">RAG-based log triage and root-cause suggestions</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">checking…</span></div>
  </header>

  <div class="card">
    <label for="log">Paste a raw log line</label>
    <textarea id="log" placeholder="nova-compute.log.1 2017-05-16 00:02:40.118 2931 ERROR nova.compute.manager [instance: 91fe] Rebuild of instance failed: ..."></textarea>
    <div class="samples" id="samples"></div>
    <div class="row">
      <button class="primary" id="go">Diagnose</button>
      <span class="hint" id="hint">Ctrl+Enter also works</span>
    </div>
  </div>

  <div id="error" class="error hidden"></div>

  <div id="result" class="card hidden">
    <div class="section-title">Classification</div>
    <p><span class="badge" id="cls"></span></p>

    <div class="section-title">Root cause</div>
    <p id="cause"></p>

    <div class="section-title">Suggested remediation</div>
    <p id="fix"></p>

    <div class="section-title">Log template (Drain3)</div>
    <p><code id="tpl"></code></p>

    <div class="section-title">Similar past incidents</div>
    <div id="hits"></div>

    <details>
      <summary>Pipeline trace</summary>
      <ul id="notes"></ul>
    </details>
  </div>
</div>

<script>
const SAMPLES = [
  {label: "Normal spawn", log: "nova-compute.log.1 2017-05-16 00:00:04.500 2931 INFO nova.compute.manager [instance: 9a3f] Took 0.26 seconds to spawn the instance on the hypervisor."},
  {label: "Network allocation", log: "nova-compute.log.1 2017-05-16 00:01:12.009 2931 ERROR nova.compute.manager [instance: 2c88] Failed to allocate network for instance, no fixed IP addresses available."},
  {label: "Disk space warning", log: "nova-compute.log.1 2017-05-16 00:02:03.771 2931 WARNING nova.compute.manager [instance: 9a3f] Instance destroyed successfully, but failed to free disk space."},
  {label: "Rebuild / binding failure", log: "nova-compute.log.1 2017-05-16 00:02:40.118 2931 ERROR nova.compute.manager [instance: 91fe] Rebuild of instance failed: NovaException: Unexpected vif_type=binding_failed"}
];

const $ = id => document.getElementById(id);

SAMPLES.forEach(s => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = s.label;
  b.onclick = () => { $("log").value = s.log; $("log").focus(); };
  $("samples").appendChild(b);
});

function badgeClass(c){
  c = (c || "").toLowerCase();
  if (c.includes("normal")) return "ok";
  if (c.includes("allocation")) return "warn";
  if (c.includes("binding")) return "bad";
  if (c.includes("disk")) return "info";
  return "neutral";
}

function text(v){ return typeof v === "string" ? v : JSON.stringify(v); }

async function checkHealth(){
  try {
    const r = await fetch("/health");
    if (!r.ok) throw new Error();
    $("dot").className = "dot up"; $("statusText").textContent = "API online";
  } catch {
    $("dot").className = "dot down"; $("statusText").textContent = "API offline";
  }
}

async function diagnose(){
  const raw_log = $("log").value.trim();
  $("error").classList.add("hidden");
  if (!raw_log){ showError("Paste a log line first."); return; }

  $("go").disabled = true; $("go").textContent = "Diagnosing…";
  $("hint").textContent = "Running triage, retrieval and diagnosis — a local model can take a few seconds.";
  const t0 = performance.now();
  try {
    const r = await fetch("/diagnose", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({raw_log})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ("Server returned " + r.status));
    render(data);
    $("hint").textContent = "Done in " + ((performance.now() - t0) / 1000).toFixed(1) + "s";
  } catch (e) {
    showError("Request failed: " + e.message);
    $("hint").textContent = "Ctrl+Enter also works";
  } finally {
    $("go").disabled = false; $("go").textContent = "Diagnose";
  }
}

function showError(msg){
  $("error").textContent = msg;
  $("error").classList.remove("hidden");
  $("result").classList.add("hidden");
}

function render(d){
  $("cls").textContent = d.classification || "unknown";
  $("cls").className = "badge " + badgeClass(d.classification);
  $("cause").textContent = text(d.root_cause || "—");
  $("fix").textContent = text(d.remediation || "—");
  $("tpl").textContent = d.template || "—";

  const hits = $("hits"); hits.innerHTML = "";
  (d.retrieved || []).forEach((h, i) => {
    const box = document.createElement("div"); box.className = "hit";
    const pct = Math.max(0, Math.min(100, Math.round((h.score || 0) * 100)));

    const meta = document.createElement("div"); meta.className = "meta";
    const left = document.createElement("span"); left.textContent = "#" + (i + 1) + " · similarity " + (h.score ?? "?");
    const right = document.createElement("span"); right.textContent = "seen " + (h.occurrence_count ?? "?") + "× before";
    meta.append(left, right);

    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("div"); fill.style.width = pct + "%";
    bar.appendChild(fill);

    const ex = document.createElement("div"); ex.className = "mono"; ex.textContent = h.example_raw || h.template || "";
    box.append(meta, bar, ex);
    hits.appendChild(box);
  });
  if (!(d.retrieved || []).length) hits.textContent = "No similar incidents found.";

  const notes = $("notes"); notes.innerHTML = "";
  (d.notes || []).forEach(n => { const li = document.createElement("li"); li.textContent = n; notes.appendChild(li); });

  $("result").classList.remove("hidden");
}

$("go").onclick = diagnose;
$("log").addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") diagnose(); });
checkHealth();
</script>
</body>
</html>
