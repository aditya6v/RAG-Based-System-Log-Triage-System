<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Triage</title>
<style>
  /* One fixed dark palette. Colour is reserved for severity; everything else is neutral. */
  :root{
    --bg:#15171b; --raise:#1b1e23; --hover:#22262c; --line:#2a2e35; --line-strong:#3a3f47;
    --text:#e3e5e8; --dim:#9aa1ab; --faint:#666c75;
    --high:#ef6f6c; --medium:#d9a547; --none:#6fbf8a; --unknown:#9aa1ab;
    --btn:#e3e5e8; --btn-text:#15171b;
    --mono:"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:14px/1.5 var(--sans)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .mono{font-family:var(--mono);font-size:12.5px}
  .dim{color:var(--dim)} .faint{color:var(--faint)}
  kbd{font:11px var(--mono);color:var(--dim);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;padding:0 4px}

  /* top bar */
  .bar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
       padding:12px 20px;border-bottom:1px solid var(--line)}
  .bar h1{font-size:15px;font-weight:600;margin:0}
  .bar .meta{font-size:12.5px}
  .api{font:12px var(--mono);color:var(--dim)}
  .api b{font-weight:400}
  .api .ok{color:var(--none)} .api .down{color:var(--high)}

  .page{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:calc(100vh - 46px)}
  main{padding:20px;min-width:0}
  aside{border-left:1px solid var(--line);padding:16px 0;min-width:0}
  @media (max-width:900px){
    .page{grid-template-columns:minmax(0,1fr)}
    aside{border-left:0;border-top:1px solid var(--line)}
  }

  /* input */
  .input label{display:block;font-weight:600;margin-bottom:6px}
  textarea{width:100%;min-height:64px;resize:vertical;padding:10px 12px;margin:0;
    background:var(--raise);color:var(--text);border:1px solid var(--line-strong);border-radius:4px;
    font:13px/1.5 var(--mono)}
  textarea::placeholder{color:var(--faint)}
  textarea:focus{outline:none;border-color:var(--dim)}
  .actions{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
  .run{background:var(--btn);color:var(--btn-text);border:0;border-radius:4px;padding:7px 16px;font-weight:600;cursor:pointer;min-width:120px}
  .run:disabled{cursor:progress;opacity:.75}
  .hint{font-size:12.5px;color:var(--faint)}

  .examples{margin-top:18px}
  .examples h2,.side h2,.sect h2{font-size:13px;font-weight:600;margin:0 0 6px}
  .ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;width:100%;text-align:left;
      background:none;border:0;border-top:1px solid var(--line);padding:6px 2px;cursor:pointer}
  .ex:last-child{border-bottom:1px solid var(--line)}
  .ex:hover{background:var(--hover)}
  .ex .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex .lab{font-size:12px;color:var(--faint)}

  /* result */
  #out{margin-top:28px}
  #out.busy{opacity:.45;transition:opacity .15s}
  .empty{color:var(--faint);border-top:1px solid var(--line);padding-top:14px}
  .err{border-left:3px solid var(--high);padding:8px 12px;background:var(--raise)}
  .err b{display:block;margin-bottom:2px}

  .verdict{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
           border-left:3px solid var(--unknown);padding:2px 0 2px 14px}
  .verdict.sev-high{border-color:var(--high)} .verdict.sev-medium{border-color:var(--medium)} .verdict.sev-none{border-color:var(--none)}
  .verdict h2{font-size:20px;font-weight:600;margin:0;line-height:1.25}
  .verdict .why{margin-top:4px;color:var(--dim);font-size:13px}
  .sevword{font-weight:600}
  .sev-high .sevword{color:var(--high)} .sev-medium .sevword{color:var(--medium)} .sev-none .sevword{color:var(--none)}
  .tool{background:none;border:1px solid var(--line-strong);border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12.5px;color:var(--dim);white-space:nowrap}
  .tool:hover{color:var(--text);border-color:var(--dim)}

  .steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;margin-top:18px;
         border:1px solid var(--line);border-radius:4px}
  .step{padding:8px 12px;border-right:1px solid var(--line)}
  .step .n{font-size:12.5px} .step .t{font:13px var(--mono)}
  .step.skip{color:var(--faint)} .step.skip .t{font-size:12px}
  .step.total{border-right:0;text-align:right;color:var(--dim)}
  @media (max-width:640px){
    .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
    .step{border-bottom:1px solid var(--line)}
    .step.total{grid-column:1/-1;text-align:left;border-bottom:0}
  }

  .tpl{margin-top:14px;font-size:12.5px;color:var(--dim)}
  .tpl code{font-family:var(--mono);color:var(--text);word-break:break-word}
  .v{color:var(--medium)}
  tr.unused .v{color:#8a7448}

  .prose{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px}
  @media (max-width:760px){.prose{grid-template-columns:1fr}}
  .sect p{margin:0}
  .note{margin-top:10px;font-size:12.5px;color:var(--faint)}

  table{width:100%;border-collapse:collapse;margin-top:6px}
  th{font-size:12px;font-weight:600;color:var(--dim);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.num,th.num{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
  tr.primary td{background:var(--raise)}
  tr.unused td{color:var(--faint)}
  .role{white-space:nowrap;font-size:12.5px}
  td.cat{white-space:nowrap}
  tr.primary .role{font-weight:600}
  .tablewrap{overflow-x:auto}

  details{margin-top:18px}
  summary{cursor:pointer;color:var(--dim);font-size:13px}
  details ol{margin:8px 0 0;padding-left:20px;color:var(--dim)}
  details li{margin:2px 0}

  /* history */
  .side{padding:0 16px}
  .side .head{display:flex;justify-content:space-between;align-items:baseline}
  .linkbtn{background:none;border:0;padding:0;color:var(--faint);cursor:pointer;font-size:12.5px}
  .linkbtn:hover{color:var(--text)}
  .hist{list-style:none;margin:6px 0 0;padding:0}
  .hist button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;width:100%;text-align:left;
    background:none;border:0;border-top:1px solid var(--line);padding:7px 2px;cursor:pointer}
  .hist button:hover,.hist button[aria-current="true"]{background:var(--hover)}
  .sq{width:8px;height:8px;margin-top:6px;background:var(--unknown)}
  .sq.sev-high{background:var(--high)} .sq.sev-medium{background:var(--medium)} .sq.sev-none{background:var(--none)}
  .hist .c{font-size:13px}
  .hist .m{grid-column:2;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist .when{float:right;color:var(--faint);font:11.5px var(--mono)}
  .side .none{color:var(--faint);font-size:13px;margin-top:6px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="bar">
  <div><h1>Log Triage</h1></div>
  <div class="meta"><span class="api" id="api">api <b>checking</b></span> <span class="faint">&middot;</span> <a href="/docs" class="dim">API docs</a></div>
</div>

<div class="page">
  <main>
    <section class="input">
      <label for="log">BGL log line</label>
      <textarea id="log" spellcheck="false" placeholder="1118538627 2005.06.11 R30-M0-N9-C:J16-U01 2005-06-11-18.10.27.692687 R30-M0-N9-C:J16-U01 RAS KERNEL FATAL data TLB error interrupt"></textarea>
      <div class="actions">
        <button class="run" id="run" type="button">Diagnose</button>
        <span class="hint"><kbd>Ctrl</kbd> <kbd>Enter</kbd> to run, <kbd>/</kbd> to focus</span>
      </div>

      <div class="examples">
        <h2>Examples <span class="faint" style="font-weight:400">from the held-out test set, with their dataset label</span></h2>
        <div id="examples"></div>
      </div>
    </section>

    <section id="out" aria-live="polite">
      <p class="empty">Results appear here: category, severity, the steps that ran, the likely cause and fix, and the past incidents they were based on.</p>
    </section>
  </main>

  <aside>
    <div class="side">
      <div class="head"><h2>History</h2><button class="linkbtn" id="clear" type="button">Clear</button></div>
      <ol class="hist" id="hist"></ol>
    </div>
  </aside>
</div>

<script>
// Real lines from eval/bgl_eval.jsonl (label token removed). `label` is the dataset's own label.
const EXAMPLES = [
  {label: "normal", log: "1118710081 2005.06.13 R03-M1-N9-C:J04-U01 2005-06-13-17.48.01.577343 R03-M1-N9-C:J04-U01 RAS KERNEL FATAL instruction address: 0x00004ed8"},
  {label: "memory / CPU fault", log: "1118538627 2005.06.11 R30-M0-N9-C:J16-U01 2005-06-11-18.10.27.692687 R30-M0-N9-C:J16-U01 RAS KERNEL FATAL data TLB error interrupt"},
  {label: "filesystem mount failure", log: "1125552602 2005.08.31 R23-M1-N8-I:J18-U01 2005-08-31-22.30.02.453491 R23-M1-N8-I:J18-U01 RAS KERNEL FATAL Lustre mount FAILED : bglio318 : point /p/gb1"},
  {label: "I/O node connection lost", log: "1124721545 2005.08.22 R73-M1-N4-I:J18-U01 2005-08-22-07.39.05.715470 R73-M1-N4-I:J18-U01 RAS APP FATAL ciod: Error reading message prefix after LOGIN_MESSAGE on CioStream socket to 172.16.96.116:53370: Link has been severed"},
  {label: "power and control system", log: "1120673475 2005.07.06 NULL 2005-07-06-11.11.15.368928 NULL RAS KERNEL FATAL Power deactivated: R05-M0-N2"}
];
const STEPS = [["retrieval", "Retrieval"], ["triage", "Triage"], ["root_cause", "Root cause"], ["remediation", "Remediation"]];
const HIST_KEY = "log-triage-history";
const $ = id => document.getElementById(id);
let CATS = {};
let current = null;

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function store(fn, fallback){ try { return fn(); } catch { return fallback; } }
function loadHist(){ return store(() => JSON.parse(localStorage.getItem(HIST_KEY)) || [], []); }
function saveHist(h){ store(() => localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 20)))); }
function secs(ms){ return ms == null ? "" : (ms < 1000 ? ms + " ms" : (ms / 1000).toFixed(2) + " s"); }
function message(line){ const p = line.trim().split(/\s+/); return p.length > 9 ? p.slice(8).join(" ") : line; }
function sevOf(d){ return d.severity || (CATS[d.classification] || {}).severity || "unknown"; }
function nameOf(id){ return (CATS[id] || {}).name || id || "unknown"; }

EXAMPLES.forEach(x => {
  const b = el("button", "ex"); b.type = "button";
  b.append(el("span", "line mono", message(x.log)), el("span", "lab", x.label));
  b.title = x.log;
  b.onclick = () => { $("log").value = x.log; $("log").focus(); };
  $("examples").appendChild(b);
});

async function init(){
  try {
    const r = await fetch("/health");
    if (!r.ok) throw 0;
    $("api").innerHTML = 'api <b class="ok">ok</b>';
  } catch { $("api").innerHTML = 'api <b class="down">unreachable</b>'; }
  try { (await (await fetch("/categories")).json()).forEach(c => CATS[c.id] = c); } catch {}
  renderHistory();
}

let ticker = null;
async function run(){
  const raw_log = $("log").value.trim();
  if (!raw_log){ $("log").focus(); return; }
  const btn = $("run"), t0 = performance.now();
  btn.disabled = true;
  const tick = () => btn.textContent = "Running " + ((performance.now() - t0) / 1000).toFixed(1) + " s";
  tick(); ticker = setInterval(tick, 100);
  $("out").classList.add("busy");
  try {
    const r = await fetch("/diagnose", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({raw_log})});
    let d;
    try { d = await r.json(); } catch { throw {status: r.status, msg: "The server answered " + r.status + " without a JSON body."}; }
    if (!r.ok) throw {status: r.status, msg: d.error || ("HTTP " + r.status)};
    render(d);
    const h = loadHist().filter(x => x.raw_log !== raw_log);
    h.unshift({raw_log, at: Date.now(), result: d}); saveHist(h); renderHistory(raw_log);
  } catch (e) {
    showError(e);
  } finally {
    clearInterval(ticker); btn.disabled = false; btn.textContent = "Diagnose";
    $("out").classList.remove("busy");
  }
}

function showError(e){
  const out = $("out"); out.innerHTML = "";
  const box = el("div", "err");
  if (e instanceof TypeError){
    box.append(el("b", null, "Can't reach the API"), el("span", "dim", "Is the server running? Start it with "), el("code", "mono", "uvicorn api.main:app --port 8000"));
  } else {
    box.append(el("b", null, e.status === 400 ? "The request was rejected" : "The pipeline failed"), el("span", "mono", e.msg || String(e)));
    if (/qdrant|reset/i.test(e.msg || "")) box.append(el("div", "dim", "Qdrant Cloud may be suspended. Resume the cluster in its dashboard."));
    else if (/mongo|ServerSelection/i.test(e.msg || "")) box.append(el("div", "dim", "Check that this network's IP is allowed in MongoDB Atlas."));
    else if (/11434|ollama|refused/i.test(e.msg || "")) box.append(el("div", "dim", "Ollama doesn't seem to be running."));
  }
  out.appendChild(box);
}

function templateNode(t){
  const code = el("code");
  (t || "").split(/(<\*>|<NUM>|<HEX>|<IP>)/).forEach(part => {
    if (!part) return;
    code.appendChild(/^<(\*|NUM|HEX|IP)>$/.test(part) ? el("span", "v", part) : document.createTextNode(part));
  });
  return code;
}

function render(d){
  current = d;
  const out = $("out"); out.innerHTML = "";
  const sev = sevOf(d), skipped = d.route === "no_action", v = d.vote || {};

  // verdict
  const verdict = el("div", "verdict sev-" + sev);
  const left = el("div");
  const h = el("h2", null, d.category_name || nameOf(d.classification));
  h.title = (CATS[d.classification] || {}).definition || "";
  const why = el("div", "why");
  why.append(el("span", "sevword", sev === "none" ? "no action" : sev + " severity"));
  const how = d.triage_method === "vote"
    ? "decided by the retrieved incidents: " + Math.round((v.share || 0) * 100) + "% agree, best match " + (v.top_score ?? 0).toFixed(3)
    : d.triage_method === "llm" ? "decided by the LLM (retrieved incidents disagreed or matched weakly)" : "";
  if (how) why.append(document.createTextNode(", " + how));
  left.append(h, why);
  const copy = el("button", "tool", "Copy JSON"); copy.type = "button";
  copy.onclick = async () => {
    const ok = await store(() => navigator.clipboard.writeText(JSON.stringify(d, null, 2)).then(() => true), Promise.resolve(false));
    copy.textContent = ok ? "Copied" : "Copy failed"; setTimeout(() => copy.textContent = "Copy JSON", 1500);
  };
  verdict.append(left, copy);
  out.appendChild(verdict);

  // steps that ran
  const t = d.timings_ms || {};
  const steps = el("div", "steps");
  STEPS.forEach(([key, label]) => {
    const ran = key in t, s = el("div", "step" + (ran ? "" : " skip"));
    s.append(el("div", "n", label), el("div", "t", ran ? secs(t[key]) : "skipped"));
    steps.appendChild(s);
  });
  const total = el("div", "step total");
  total.append(el("div", "n", "Total"), el("div", "t", secs(d.total_ms ?? Object.values(t).reduce((a, b) => a + b, 0))));
  steps.appendChild(total);
  steps.setAttribute("aria-label", "Steps: " + STEPS.map(([k, l]) => l + " " + (k in t ? secs(t[k]) : "skipped")).join(", "));
  out.appendChild(steps);

  // template
  const tpl = el("div", "tpl");
  tpl.append(document.createTextNode(d.cluster_id != null ? "Template " + d.cluster_id + ": " : "No stored template matched; searched with the line itself: "), templateNode(d.template));
  out.appendChild(tpl);

  // cause and fix
  if (skipped){
    const s = el("div", "sect"); s.style.marginTop = "22px";
    s.append(el("p", "dim", "Severity is '" + sev + "' for this category, so no root cause or fix was generated."));
    out.appendChild(s);
  } else {
    const prose = el("div", "prose");
    [["Likely cause", d.root_cause], ["Suggested fix", d.remediation]].forEach(([title, text]) => {
      const s = el("div", "sect"); s.append(el("h2", null, title), el("p", null, text || "(empty)")); prose.appendChild(s);
    });
    out.appendChild(prose);
    out.appendChild(el("p", "note", "Generated by the local LLM from the incidents below. It can state details that are not in the evidence, so check before acting."));
  }

  // evidence
  const ev = d.evidence || {}, primary = ev.primary && ev.primary.cluster_id;
  const supporting = new Set((ev.supporting || []).map(s => s.cluster_id));
  const sect = el("div", "sect"); sect.style.marginTop = "26px";
  sect.appendChild(el("h2", null, "Similar past incidents"));
  const wrap = el("div", "tablewrap"), table = el("table"), thead = el("thead"), hr = el("tr");
  // "Used as" only means something when the root-cause step ran.
  const cols = [["#", "num"], ...(skipped ? [] : [["Used as", ""]]), ["Similarity", "num"], ["Category", ""], ["Seen", "num"], ["Template", ""]];
  cols.forEach(([c, cls]) => hr.appendChild(el("th", cls, c)));
  thead.appendChild(hr); table.appendChild(thead);
  const tb = el("tbody");
  (d.retrieved || []).forEach((r, i) => {
    const role = skipped ? null : r.cluster_id === primary ? "primary" : supporting.has(r.cluster_id) ? "supporting" : "not used";
    const tr = el("tr", role === "primary" ? "primary" : role === "not used" ? "unused" : "");
    const tdT = el("td"); tdT.appendChild(templateNode(r.template)); tdT.firstChild.classList.add("mono");
    tr.appendChild(el("td", "num", String(i + 1)));
    if (role) tr.appendChild(el("td", "role", role));
    tr.append(el("td", "num", (r.score ?? 0).toFixed(3)), el("td", "cat", nameOf(r.label)),
              el("td", "num", r.occurrence_count != null ? r.occurrence_count + "x" : ""), tdT);
    tb.appendChild(tr);
  });
  if (!(d.retrieved || []).length){ const tr = el("tr"), td = el("td", "dim", "No similar incidents found."); td.colSpan = cols.length; tr.appendChild(td); tb.appendChild(tr); }
  table.appendChild(tb); wrap.appendChild(table); sect.appendChild(wrap);
  if (!skipped) sect.appendChild(el("p", "note", "Only the primary match and supporting matches (similarity 0.85 or more, same category) were given to the LLM."));
  out.appendChild(sect);

  // trace
  if ((d.notes || []).length){
    const det = el("details"), sum = el("summary", null, "Trace (" + d.notes.length + " steps)"), ol = el("ol", "mono");
    d.notes.forEach(n => ol.appendChild(el("li", null, n)));
    det.append(sum, ol); out.appendChild(det);
  }
}

function renderHistory(active){
  const list = $("hist"); list.innerHTML = "";
  const h = loadHist();
  if (!h.length){ list.appendChild(el("li", "none", "Nothing yet.")); return; }
  h.forEach(item => {
    const d = item.result || {}, li = el("li"), b = el("button"); b.type = "button";
    if (item.raw_log === active) b.setAttribute("aria-current", "true");
    const c = el("span", "c", d.category_name || nameOf(d.classification));
    c.appendChild(el("span", "when", new Date(item.at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})));
    b.append(el("span", "sq sev-" + sevOf(d)), c, el("span", "m mono", message(item.raw_log)));
    b.onclick = () => { $("log").value = item.raw_log; render(d); renderHistory(item.raw_log); };
    li.appendChild(b); list.appendChild(li);
  });
}

$("clear").onclick = () => { saveHist([]); renderHistory(); };
$("run").onclick = run;
$("log").addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); run(); } });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("log")){ e.preventDefault(); $("log").focus(); }
});
init();
</script>
</body>
</html>
