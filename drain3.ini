; Drain3 config. The one knob you'll actually touch is sim_th.
;
; sim_th (0-1) controls how similar two log lines must be to collapse into
; the same template. Too high (e.g. 0.8+) -> near-identical lines stay as
; separate "incidents" and your retrieval step never finds a match. Too low
; (e.g. <0.3) -> unrelated errors get merged into one meaningless template.
; 0.4 is a reasonable starting point for OpenStack-style logs; if your
; ingestion run produces way more or way fewer clusters than seems right
; for the data, this is the first thing to adjust.
[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 1000

[MASKING]
masking = []

[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = true
